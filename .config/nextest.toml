# cargo-nextest (https://nexte.st): runs every test in its own process, in parallel across test
# binaries. Optional for local runs; `cargo test` keeps working and stays what CI runs.
#
#   cargo nextest run --workspace        # all tests except doctests
#   cargo test --doc --workspace         # nextest does not run doctests
#
# Offscreen UI renders create wgpu devices; cap how many run at once.
[test-groups]
gpu = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(guitario-ui-egui) & kind(test)'
test-group = 'gpu'
