name: Release

# A tag `v<version>` (the workspace version, `cargo xtask version`) builds the packages on every
# platform with `cargo xtask package` and drafts a GitHub release with them; a maintainer reviews
# the draft and publishes it. Run by hand (Actions › Release › Run workflow) or by a pull request
# that touches the packaging, it builds the same packages as artifacts without a release.
#
# Signing uses these repository secrets when they are set; without them the packages are unsigned.
#   macOS:   MACOS_CERTIFICATE (base64 .p12 of a Developer ID Application certificate),
#            MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY ("Developer ID Application: … (TEAM)"),
#            and for notarization APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific).
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD.

on:
  push:
    tags: ["v*"]
  # A pull request that changes the packaging builds the packages too (unsigned: no secrets).
  pull_request:
    paths:
      - "packaging/**"
      - "xtask/src/package.rs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GUITARIO_CONFIG_DIR: ""

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      # Secrets cannot be tested in `if:`; these only say whether each is set.
      SIGN_MACOS: ${{ secrets.MACOS_CERTIFICATE != '' }}
      SIGN_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (egui/winit/rfd/cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: The tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(cargo xtask version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (cargo xtask version set …)"
            exit 1
          fi

      # Everything is compiled before any secret is in the environment, so no build script sees one.
      - name: Build
        run: |
          cargo build --locked -p xtask
          cargo build --release --locked -p guitario -p guitario-cli --target ${{ matrix.target }}

      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Write the Windows signing certificate
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.pfx"
          echo "GUITARIO_WINDOWS_CERT=$RUNNER_TEMP/certificate.pfx" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        env:
          GUITARIO_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          GUITARIO_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          GUITARIO_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GUITARIO_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          GUITARIO_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: cargo xtask package --target ${{ matrix.target }} --no-build

      - name: Remove the Windows signing certificate
        if: always() && runner.os == 'Windows'
        shell: bash
        run: rm -f "$RUNNER_TEMP/certificate.pfx"

      - uses: actions/upload-artifact@v4
        with:
          name: guitario-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.deb
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "Guitario ${GITHUB_REF_NAME#v}" --generate-notes
