[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/guitario", "apps/guitario-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Shared Craft libraries, pinned by immutable revision (https://github.com/storytold/craft-libs).
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529", features = ["egui", "menu"] }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529", version = "=0.1.0", default-features = false, features = ["write"] }
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529" }
# internal
guitario-theory = { path = "crates/theory" }
guitario-score = { path = "crates/score" }
guitario-midi = { path = "crates/midi" }
guitario-playback = { path = "crates/playback" }
guitario-audio = { path = "crates/audio" }
guitario-format = { path = "crates/format" }
guitario-gp = { path = "crates/gp" }
guitario-musicxml = { path = "crates/musicxml" }
guitario-engine = { path = "crates/engine" }
guitario-ui-egui = { path = "crates/ui-egui" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
toml = "1"
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# craft-pdf's writer needs the patched Krilla (it refuses to compile against stock Krilla); Cargo
# ignores the patch in craft-libs' own workspace, so it is repeated here at the same revision.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529", version = "=0.8.2" }
