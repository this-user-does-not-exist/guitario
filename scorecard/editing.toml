[[item]]
id = "EDIT-16"
target = "Grace notes, trills, tremolo picking marks, fingering, lyrics, chord names"
status = "done"
note = "chord names and diagrams (beat.setChord, beat.chordFromNotes names a beat from its notes, Tools › Chord Diagrams…; crates/engine/src/chords.rs), read and written in Guitar Pro 3-5 and GPIF; tremolo picking (beat.setTremolo: eighth, sixteenth or thirty-second, per beat or selection) and trills (note.setTrill: the other fret and a speed), with Note › Tremolo Picking… and Note › Trill… dialogs, undo, playback and Guitar Pro 3-5 and 6-8 import and export; grace notes (note.setGrace and Note › Grace Note…: fret, sixteenth to sixty-fourth, before or on the beat, struck, slid, bent or hammered, dead), played, drawn, in ASCII tab and read and written in Guitar Pro 3-5 and GPIF; lyrics (track.setLyrics and Track › Lyrics…: five lines per track from a bar, one syllable per beat with Guitar Pro's hyphen, + and [comment] conventions), drawn under the tab and read and written in Guitar Pro 4-5 and GPIF; fingering for both hands (note.setFingering, Note › Fingering…: T and 1-4 beside the head, p i m a c above the beat), read and written in Guitar Pro 3-5 and GPIF"
