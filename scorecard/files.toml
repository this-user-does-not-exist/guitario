# Scorecard checklist: files and exchange. Verified 2026-10-16.
area = "files"
title = "Files and exchange"
order = 4

[[item]]
id = "FILE-1"
target = "Native .gt: versioned, validated on load, atomic saves (craft-atomic)"
status = "done"
note = "crates/format tests"

[[item]]
id = "FILE-2"
target = "Guitar Pro 7/8 (.gp) import"
status = "partial"
stage = "beta"
note = "notes, rhythms, effects, repeats, tempo, tunings, drum kits (articulation index or Midi number; the rim shot, half-open hi-hat, ride edge and chokes are read and written as Guitar Pro 7's kit entries with its heads and technique signs, and flams as grace beats), shared objects; alternate endings, directions, triplet feel, free time, double bars, strums, pick strokes, slap/pop, fades, wide vibrato, heavy accents and tapping too; voices 1-4 are read (rest-only voices dropped); grace notes, chords, lyrics, fermatas and fingering are read; whammy curves (`<Whammy>`) and vibrato with the bar are read and written; tested on demos/guitar-pro/import-test.gp; the format is told by content, so File › Open takes any Guitar Pro file"

[[item]]
id = "FILE-3"
target = "Guitar Pro 6 (.gpx) and 3-5 (.gp3/.gp4/.gp5) import"
status = "done"
stage = "beta"
note = "crates/gp/src/legacy.rs and gpx.rs: two voices, chords, repeats and endings, directions, triplet feel, techniques; 39 real GP3-5 and 37 real GP6 files import (local corpus, crates/gp/tests/corpus.rs); GP6 drum hits are read from the kit element and variation (crates/gp/src/gpif.rs gp6_drum, from GP6 files beside their GP5 copies and GP7's kit order: snare rim shot, half-open hi-hat, ride edge and cymbal chokes are articulations; elements 2 and 4 were never seen and are dropped with a warning); GP3-5 flams on drum hits are read, and `.gp5` export writes an articulation as its General MIDI piece with a warning; tremolo picking and trills are read; whammy dives are read (GP3 depth as a dip, GP4-5 curves, GP6 `WhammyBar…` properties) and written to `.gp5`"

[[item]]
id = "FILE-4"
target = "Guitar Pro (.gp) export"
status = "done"
note = "crates/gp/src/writegp.rs, file.exportGp (File › Export › Guitar Pro 8…): every demo and all 76 real corpus files read back unchanged (crates/gp/tests/gp7.rs, corpus.rs); chord names and track volume/pan are left out and reported; not yet opened in Guitar Pro itself (needs a human check)"

[[item]]
id = "FILE-5"
target = "MIDI export (format 1, repeats unrolled, ties merged); MIDI import"
status = "done"
stage = "beta"
note = "export: format 1 with title, tempo, time and key signatures; harmonics at the pitch they sound (a semi-harmonic with the note under it), staccato at half length; bends, slides and the whammy bar are not written as pitch bends. Import (crates/midi/src/import.rs, File › Import › MIDI…, File › Open): format 0 and 1, a track per MIDI track and channel, channel 10 as drums, per-quarter quantization that finds triplets, fingering onto strings and frets, a tuning that fits the range; every demo comes back at 99-100 % of its notes (93 % for the technique showcase: trills and grace notes). Pitch bends and controller changes after the first note are not imported"

[[item]]
id = "FILE-6"
target = "MusicXML import and export"
status = "done"
stage = "beta"
note = "crates/musicxml (L3): MusicXML 4.0 partwise export and import of .musicxml/.xml and compressed .mxl (File › Import/Export › MusicXML…, File › Open, cli convert). Tunings in staff-details, strings and frets in technical (checked against the pitch, fingered when absent), up to four voices, tuplets, ties, repeats, endings, sections, tempo, keys, dynamics, lyrics, chord names and diagrams, drums as unpitched parts (an articulation sounds as its General MIDI drum and comes back by its instrument name; heads per articulation, flams), and the guitar effects; every demo comes back bar for bar; MuseScore 4 reads the export and its own export of a demo imports with the same rhythms and pitches (tests/data). Not written: whammy curves, fades; timewise files are refused"

[[item]]
id = "FILE-7"
target = "PDF export and printing"
status = "partial"
stage = "beta"
note = "File › Export › PDF… and `guitario-cli convert in out.pdf` write A4 vector pages with embedded font subsets and selectable text, for one track, each track in turn or all stacked as a full score (`together`, `--score`), with or without notation, on the score's own paper (crates/ui-egui/src/pdf.rs); File › Print… (Cmd+P) sends the same pages through craft-print with printer, copies, collate, sides and black and white, on a worker thread (file.print, file.printers); every demo exports without warnings and its pages were looked at as rasters; not yet sent to a real printer (human check)"

[[item]]
id = "FILE-8"
target = "ASCII tab export"
status = "done"

[[item]]
id = "FILE-9"
target = "Recent files, open from the command line, unsaved-changes prompt on close, New and Open"
status = "done"
note = "craft-settings recent list; craft-quit close handling"

[[item]]
id = "FILE-10"
target = "Guitar Pro 5 (.gp5) export (File › Export › Guitar Pro 5…)"
status = "done"
note = "crates/gp/src/write5.rs, file.exportGp5: every demo round-trips (crates/gp/tests/gp5.rs) and real GP3-5 files come back unchanged; double dots, more than two voices or seven strings, fades out and free time are reported as dropped; demos/gp5/"

[[item]]
id = "FILE-11"
target = "Print preview, page setup (paper size, margins), headers and footers, print selected bars"
status = "done"
stage = "beta"
note = "File › Print Preview… shows the pages exactly as the PDF has them; File › Stylesheet… (F7) has Guitar Pro's Page & Score Format tab (twelve paper formats A3 to Statement or a custom size, orientation, margins; score.setPage) and its Header & Footer tab (first page: title, subtitle, artist, album, words, music, words & music, transcriber, copyright and its second line, page number; other pages: header, copyright lines, page number mirrored on even pages; each with on/off, a token template, alignment, font, size, bold and italic; score.setHeaderFooter), saved in the .gt file and drawn the same on screen, in the PDF and on paper; File › Print… and file.exportPdf print selected bars (bars [first, last]); the page setup is read from and written to Guitar Pro 5 and 6/7/8 files, any other size as a custom paper. Header and footer texts are not yet exchanged with Guitar Pro's BinaryStylesheet (1.0)"

