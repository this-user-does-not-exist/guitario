# Scorecard checklist: files and exchange. Verified 2026-10-16.
area = "files"
title = "Files and exchange"
order = 4

[[item]]
id = "FILE-1"
target = "Native .gt: versioned, validated on load, atomic saves (craft-atomic)"
status = "done"
note = "crates/format tests"

[[item]]
id = "FILE-2"
target = "Guitar Pro 7/8 (.gp) import"
status = "partial"
stage = "beta"
note = "notes, rhythms, effects, repeats, tempo, tunings, drum kits (articulation index or Midi number), shared objects; alternate endings, directions, triplet feel, free time, double bars, strums, pick strokes, slap/pop, fades, wide vibrato, heavy accents and tapping too; voices 1-4 are read (rest-only voices dropped); grace notes, chords, lyrics, fermatas and fingering are read; whammy curves (`<Whammy>`) and vibrato with the bar are read and written; tested on demos/guitar-pro/import-test.gp; the format is told by content, so File › Open takes any Guitar Pro file"

[[item]]
id = "FILE-3"
target = "Guitar Pro 6 (.gpx) and 3-5 (.gp3/.gp4/.gp5) import"
status = "partial"
stage = "beta"
note = "crates/gp/src/legacy.rs and gpx.rs: two voices, chords, repeats and endings, directions, triplet feel, techniques; 39 real GP3-5 and 37 real GP6 files import (local corpus, crates/gp/tests/corpus.rs); GP6 drum hits (kit element and variation) are dropped; tremolo picking and trills are read; whammy dives are read (GP3 depth as a dip, GP4-5 curves, GP6 `WhammyBar…` properties) and written to `.gp5`"

[[item]]
id = "FILE-4"
target = "Guitar Pro (.gp) export"
status = "done"
note = "crates/gp/src/writegp.rs, file.exportGp (File › Export › Guitar Pro 8…): every demo and all 76 real corpus files read back unchanged (crates/gp/tests/gp7.rs, corpus.rs); chord names and track volume/pan are left out and reported; not yet opened in Guitar Pro itself (needs a human check)"

[[item]]
id = "FILE-5"
target = "MIDI export (format 1, repeats unrolled, ties merged); MIDI import"
status = "done"
stage = "beta"
note = "export: format 1 with title, tempo, time and key signatures. Import (crates/midi/src/import.rs, File › Import › MIDI…, File › Open): format 0 and 1, a track per MIDI track and channel, channel 10 as drums, per-quarter quantization that finds triplets, fingering onto strings and frets, a tuning that fits the range; every demo comes back at 99-100 % of its notes (93 % for the technique showcase: trills and grace notes). Pitch bends and controller changes after the first note are not imported"

[[item]]
id = "FILE-6"
target = "MusicXML import and export"
status = "missing"
stage = "beta"

[[item]]
id = "FILE-7"
target = "PDF export and printing"
status = "partial"
stage = "beta"
note = "File › Export › PDF… and `guitario-cli convert in out.pdf` write A4 vector pages with embedded font subsets and selectable text, for one track, each track in turn or all stacked as a full score (`together`, `--score`), with or without notation, on the score's own paper (crates/ui-egui/src/pdf.rs); File › Print… (Cmd+P) sends the same pages through craft-print with printer, copies, collate, sides and black and white, on a worker thread (file.print, file.printers); every demo exports without warnings and its pages were looked at as rasters; not yet sent to a real printer (human check)"

