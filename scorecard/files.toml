status = "done"
note = "craft-settings recent list; craft-quit close handling"

[[item]]
id = "FILE-10"
target = "Guitar Pro 5 (.gp5) export (File › Export › Guitar Pro 5…)"
status = "done"
note = "crates/gp/src/write5.rs, file.exportGp5: every demo round-trips (crates/gp/tests/gp5.rs) and real GP3-5 files come back unchanged; double dots, more than two voices or seven strings, fades out and free time are reported as dropped; demos/gp5/"

[[item]]
id = "FILE-11"
target = "Print preview, page setup (paper size, margins), headers and footers, print selected bars"
status = "partial"
stage = "beta"
note = "File › Print Preview… shows the pages exactly as the PDF has them (one track or all, page by page); File › Page Setup… sets A4, A5, Letter or Legal, portrait or landscape and the four margins (score.setPage, saved in the .gt file, one undo step), used by the page view, the PDF and the print job; the page setup is read from and written to Guitar Pro 5 and 6/7/8 files (checked on a real Letter file); no headers and footers, no printing of selected bars, no other paper (gap G2)"

