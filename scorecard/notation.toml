# Scorecard checklist: notation and engraving. Verified 2026-10-16 by offscreen renders
# (cargo run -p guitario-ui-egui --example snapshot).
area = "notation"
title = "Notation and engraving"
order = 2

[[item]]
id = "NOTE-1"
target = "Page view: A4 pages, title, artist, tuning legend, tempo marking, bar numbers"
status = "done"
note = "page.rs, layout.rs (layout tests); GP stylesheet defaults"

[[item]]
id = "NOTE-2"
target = "Standard notation over tablature, joined by a bracket, with TAB clef"
status = "done"

[[item]]
id = "NOTE-3"
target = "Pitch spelling, key signatures, accidentals with bar memory, ledger lines"
status = "done"
note = "notation.rs tests; a key change inside a system is drawn at its bar (naturals for what the old key loses, then the new key, before any time signature; notation::key_cancel, layout key_w, page key_change), and a system opening on a change shows the new key in its prefix; the system before a change ends with courtesy signatures after its last bar line (the next key, with naturals, and time signature; the staff runs on to them, and the line gives up a bar when they would not fit; layout::courtesy_of, SystemBox.courtesy)"

[[item]]
id = "NOTE-4"
target = "Stems, flags, beams with secondary beams, rests, dots, tuplet numbers"
status = "done"
note = "beams slope with the outer notes (at most a staff space, flat over an inner peak) and keep every stem long enough; groups follow the bar's beaming (measure.setBeaming) or the signature's usual one (7/8 as 2+2+3, 13/16 as 4+4+5, 6/8 as 3+3; guitario_score::default_beaming), kept in Guitar Pro 5 files; Guitar Pro's per-beat beam breaks are not modelled"

[[item]]
id = "NOTE-5"
target = "Ties and slurs drawn between notes in standard notation"
status = "done"
note = "tie arcs in notation and tab, across bar lines and system breaks; slurs for hammer-ons, pull-offs and legato slides; several voices with stems up and down, the stem-down head stepping right of a second or of a different head on one pitch (page.rs heads_clash, layout.rs, page::tests); user-placed slurs are not modelled"

[[item]]
id = "NOTE-6"
target = "Tab effects: P.M., let ring and vibrato lanes, bends with labels, slides, H/P arcs, harmonics"
status = "done"

[[item]]
id = "NOTE-7"
target = "Tab-only view with rhythm (stems and beams) under the tab"
status = "done"

[[item]]
id = "NOTE-8"
target = "Music font: SMuFL (Bravura or Leland) found at runtime, drawn fallbacks without it"
status = "done"
note = "fonts.rs, glyphs.rs"

[[item]]
id = "NOTE-9"
target = "Tremolo picking slashes, grace notes, trills, fermatas, alternate ending brackets"
status = "done"
note = "alternate ending brackets and direction marks (segno, coda, Fine, D.C./D.S.) drawn; tremolo picking slashes (one to three through the stem, above a whole note, under the tab when notation is hidden) and trills (tr with a wavy line above the staff and in the tab lane) drawn, with painted-shape tests; grace notes drawn small left of their note (a slashed eighth before the beat, unslashed on it, slurred into the note; a small fret in the tab with its slur, slide or bend), with room kept by the layout; fermatas (short, medium, long; beat.setFermata and the palette) drawn over the beat they hold, played by stretching time in every track and written to MIDI as tempo changes, read and written in GPIF (Guitar Pro 5 has none)"

[[item]]
id = "NOTE-10"
target = "Multitrack view and page/screen/horizontal layouts"
status = "done"
note = "View › Layout › Page, Screen (one sheet as wide as the window) and Horizontal (one line of bars, no title); View › Multitrack stacks every track in each system with beats lined up in time across tracks (layout.rs layout_parts, page.rs paint_systems), markers and directions over the top track, clicks on any track move the cursor there; saved in the preferences; printed and exported as a full score too (file.exportPdf and file.print `together`, the print and preview dialogs' 'As a full score' option, `guitario-cli convert --score`; page.rs print_score_layout), which File › Print, Print Preview and Export PDF choose when the multitrack view is on"

[[item]]
id = "NOTE-11"
target = "Drum notation (percussion clef, noteheads per articulation)"
status = "done"
note = "percussion clef, kit-map staff positions, cross noteheads for cymbals (theory::drums, page.rs)"

[[item]]
id = "NOTE-12"
target = "Chord diagrams and chord names above the staff"
status = "done"
note = "chord names and beat text drawn above the system in a lane that grows when a track has them; diagrams drawn under the names (nut or first fret, dots, open and muted marks, barres; page.rs chord_diagram, layout.rs), edited in Tools › Chord Diagrams… (a clickable diagram, named from its notes by guitario_theory::chord_name) and read and written in Guitar Pro 3-5 and GPIF; the chord list under the title on the first page (each distinct diagram once, in order of first use, at most 48, wrapping into rows; layout.rs chord_list), in the page view, print and PDF; no stylesheet switch to hide it"
