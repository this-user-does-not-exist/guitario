# Scorecard checklist: playback. Verified 2026-10-18 (crates/playback tests; nobody has listened
# to the output on real speakers yet).
area = "playback"
title = "Playback"
order = 3

[[item]]
id = "PLAY-1"
target = "Play from the cursor and stop with Space; cursor follows playback on page, LCD, fretboard, global view"
status = "done"

[[item]]
id = "PLAY-2"
target = "Metronome, count-in, loop (selection or song), relative speed 25-200 %"
status = "done"
note = "player.rs tests count_in_and_metronome_click, loops_a_range"

[[item]]
id = "PLAY-3"
target = "Guitar and bass sound with palm mute, dead notes, bends, vibrato, legato hammer-ons and slides, let ring"
status = "done"
stage = "beta"
note = "physical-model synth (Karplus-Strong) with a natural decay by pitch (about 7 s near A2, never over 10 s) and a quarter-second release when a note ends; palm mutes damp the highs in the string loop and die in 0.7 to 0.15 s by the track's palm-mute weight, pitch kept true; dead notes click for 45 ms; harmonics ring at their partial (natural by the node at the fret, pure; artificial and tapped an octave up; pinch and semi two octaves up over some of the note); shift and legato slides glide over the end of the first note (a shift slide picks the second), slides in and out scoop, fall or rise and fade; hammer-ons, pull-offs and taps carry on the string with the finger's energy; staccato plays half the note; slap and pop are brighter (player.rs and articulation.rs tests: pitches within 1.2 %, decay, picks counted); let ring holds a note past its length until it dies away, also past the end of the song, unless its string is struck again, which stops it within milliseconds (synth and samples; MIDI note-offs follow the same rule); sampled instruments take a program per articulation (PLAY-8); MIDI export plays harmonics and staccato; the overdriven and distorted programs play through an amp and cabinet model (PLAY-5); not heard on speakers"

[[item]]
id = "PLAY-4"
target = "Drum playback (General MIDI kit)"
status = "done"
note = "synthesised kit (kick, snare, hats with choke, cymbals, toms), drums_sound_and_hats_choke; MIDI channel 10; Guitar Pro's articulations sound as the piece they vary, synthesised or sampled: a choked cymbal stops at the end of its note, the half-open hi-hat after at most 0.18 s, a rim shot is louder (a_choked_cymbal_stops_at_the_end_of_its_note); MIDI export writes the General MIDI drum"

[[item]]
id = "PLAY-5"
target = "Amp and effect chains per track, mixer with volume/pan/mute/solo"
status = "done"
note = "Sound › Mixer… (mixer.rs): a strip per track with instrument, pan, volume fader, mute, solo and EQ, and a master fader, heard live while playing (Player::set_mix, gains glide over 10 ms; faders heard while dragged, one undo step on release); Sound › Audio Settings… picks the output device and buffer size; an effect chain per track of up to six original effects (amp, cabinet, overdrive, distortion, noise gate, compressor, ten-band EQ, chorus, tremolo, delay, reverb; crates/playback/src/fx, track.setEffect and friends, the inspector's chain rows and knob windows), the overdriven programs default to an amp and cabinet; the mixer's five-band EQ with presets (track.setEq, the global view's Eq. popup); master volume and pan and the compressor, reverb and EQ mastering slots (score.setMaster, score.setMastering, the Song inspector); fx tests check each effect's response, bounds and tails; the cabinet is a filter model (impulse responses from files are 1.0, issue 121); not heard on speakers"

[[item]]
id = "PLAY-6"
target = "Automations (tempo ramps, volume, pan) and triplet feel / swing"
status = "done"
note = "triplet feel swings the timeline (score::TripletFeel::warp); fades, swells, strums and arpeggios play; tempo automation: each tempo point jumps or glides from the one before (MeasureHeader::tempo_linear, Score::tempo_curves; the tempo map integrates the glide exactly, fermatas on it included), edited in Sound › Automations › Tempo Automation… with the curve drawn, marked accel./rit. in the score, written to MIDI as a step per quarter, read and written in GPIF (points inside a bar move to the nearest bar line; .gp5 writes jumps and says so); volume and pan automation per track (Measure::volume/pan and their linear flags, track.setAutomation, Sound › Automations › Volume / Pan Automation… with the curve) and for the master (MeasureHeader::master, score.setMasterAutomation, the global view's Master row A buttons and the same window): played over the mixer (the player looks them up every 64 samples, from wherever playback starts), written to MIDI as controllers 7 and 10 (a step per quarter while gliding); not yet read from or written to Guitar Pro files (the exports say so)"

[[item]]
id = "PLAY-7"
target = "Render to audio (WAV); MP3, FLAC and OGG"
status = "partial"
stage = "1.0"
note = "WAV and lossless FLAC (file.exportAudio by format or extension, File › Export › Audio…, `guitario-cli convert x.flac`; pure-Rust flacenc, checked sample for sample by decoding); no MP3 or OGG (their encoders are C libraries; the command says so)"

[[item]]
id = "PLAY-8"
target = "Sampled instruments: recorded drums, bass and guitars from open SFZ libraries"
status = "partial"
stage = "beta"
note = "SFZ engine and per-role sound bank (docs/sounds.md), tested on real libraries; a role can name a program per articulation (sustain, palm mute, dead, harmonic, legato), each a file or a keyswitch in one (bank.json; SoundBank::program, Player::set_articulation), loading only the keys its notes play; without a legato program a hammer-on, pull-off or legato slide moves the sounding sample to the new pitch; release samples (`trigger=release` with `rt_decay`), `trigger=legato` regions for hammer-ons, filters with their envelope, velocity curves, `loop_crossfade`, WAV `smpl` loops and OGG Vorbis samples (sfz tests measure each); samples decode on every core and in the background whenever the score needs new notes (SoundBank::preload and ready; ui-egui sounds.rs), Play waits for them instead of freezing; no LFOs or EQ opcodes; the app installs the recommended libraries (the Sound Bank window, a first-run offer, sound.installLibraries; crates/playback/src/install.rs: curl with resume, zip and 7z unpacked in Rust; checked by installing three of them for real) and a track can name its instrument (track.setBank: a role or an .sfz file, saved in the score); of the libraries, only Growlybass records more than sustain and its release noises are used; samples are held as 16-bit values, and a sample longer than 2 s keeps its first second in memory and streams the rest from disk when a note reaches it (sfz/stream.rs: the 400-bar perf score's instruments take 25 MB instead of 500 MB, budget sounds_memory_mb; no late tail at real speed); not yet auditioned on speakers (issues 115, 133)"

[[item]]
