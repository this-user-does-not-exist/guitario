[[item]]
id = "PLAY-11"
target = "Instruments beyond guitar and bass: pianos, orchestral strings, keyboards, winds and brass"
status = "partial"
stage = "1.0"
note = "a modelled grand piano (programs 0 to 3: grand, bright, electric grand, honky-tonk; piano.rs: modes per key with stretched partials, two or three detuned unison strings and an aftersound, a nonlinear felt hammer simulated against the moving strings, dampers, restrikes, the sustain pedal's sympathetic strings when notes let ring) and the violin family (programs 40 to 45, 48, 49, 110: violin, viola, cello, double bass, tremolo, pizzicato, alone or as sections of up to sixteen players (Track::players; Add Track's Violins I and II, Violas, Cellos, Double Basses) and the ensembles as a string orchestra, each player with their own intonation, timing, vibrato and bow on one of up to four matched instruments across the stage, chords divided; bowed.rs: a waveguide string bowed through a hyperbolic friction junction, bow changes, slurs in one stroke, delayed vibrato, intonation by ear, pressing harder when the string whistles, slips placed between samples), each through a body of resonances with sympathetic strings (body.rs), the violin family's voiced per instrument against recordings of real soloists and sections (docs/strings-calibration.md, `strings_compare`); tests measure hammer contact times, brightness with velocity, dampers, Helmholtz motion over the whole range, pitch within 4 cents, hostile scores at 8 and 192 kHz; the piano's inharmonicity, stretch, two-stage decay, spectral lean with dynamics and loudness by register are fitted to recordings of two grands (Iowa MIS Steinway B, Salamander Yamaha C5), as close to their mean as they are to each other; `cargo run -p guitario-playback --release --example audition` renders original phrases (and single keys with `--keys`, to measure); no organ, electric piano, winds, brass or synths; not heard on speakers"
