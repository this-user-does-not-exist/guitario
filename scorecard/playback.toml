target = "Pedalboard of original effect models (overdrive to wah) and mastering effects on the master bus"
status = "missing"
stage = "1.0"
note = "the three mastering slots are live (PLAY-5); no pedalboard (issues 466 to 468, 482, 525, 526)"

[[item]]
id = "PLAY-10"
