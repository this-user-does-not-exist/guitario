# Scorecard checklist: playback. Verified 2026-10-15 (crates/playback tests; nobody has listened
# to the output on real speakers yet).
area = "playback"
title = "Playback"
order = 3

[[item]]
id = "PLAY-1"
target = "Play from the cursor and stop with Space; cursor follows playback on page, LCD, fretboard, global view"
status = "done"

[[item]]
id = "PLAY-2"
target = "Metronome, count-in, loop (selection or song), relative speed 25-200 %"
status = "done"
note = "player.rs tests count_in_and_metronome_click, loops_a_range"

[[item]]
id = "PLAY-3"
target = "Guitar and bass sound with palm mute, dead notes, bends, vibrato, legato hammer-ons and slides, let ring"
status = "partial"
stage = "beta"
note = "physical-model synth (Karplus-Strong) with a natural decay by pitch (about 7 s near A2, never over 10 s); let ring holds a note past its length until it dies away, also past the end of the song, unless its string is struck again, which stops it within milliseconds (synth and samples; MIDI note-offs follow the same rule); not sampled articulations like Guitar Pro's RSE"

[[item]]
id = "PLAY-4"
target = "Drum playback (General MIDI kit)"
status = "done"
note = "synthesised kit (kick, snare, hats with choke, cymbals, toms), drums_sound_and_hats_choke; MIDI channel 10"

[[item]]
id = "PLAY-5"
target = "Amp and effect chains per track, mixer with volume/pan/mute/solo"
status = "partial"
stage = "beta"
note = "Sound › Mixer… (mixer.rs): a strip per track with instrument, pan, volume fader, mute and solo, heard live while playing (Player::set_mix, gains glide over 10 ms; faders heard while dragged, one undo step on release); track.setMix and track.setProgram take any track; Sound › Audio Settings… picks the output device and buffer size, saved in the preferences (a missing device falls back to the default and says so); one fixed amp model per program; no effect chain or master section"

[[item]]
id = "PLAY-6"
target = "Automations (tempo ramps, volume, pan) and triplet feel / swing"
status = "done"
note = "triplet feel swings the timeline (score::TripletFeel::warp); fades, swells, strums and arpeggios play; tempo automation: each tempo point jumps or glides from the one before (MeasureHeader::tempo_linear, Score::tempo_curves; the tempo map integrates the glide exactly, fermatas on it included), edited in Sound › Automations › Tempo Automation… with the curve drawn, marked accel./rit. in the score, written to MIDI as a step per quarter, read and written in GPIF (points inside a bar move to the nearest bar line; .gp5 writes jumps and says so); volume and pan automation per track (Measure::volume/pan and their linear flags, track.setAutomation, Sound › Automations › Volume / Pan Automation… with the curve): played over the mixer (the player looks them up every 64 samples, from wherever playback starts), written to MIDI as controllers 7 and 10 (a step per quarter while gliding); not yet read from or written to Guitar Pro files (the exports say so)"

[[item]]
id = "PLAY-7"
target = "Render to audio (WAV); MP3, FLAC and OGG"
status = "partial"
stage = "1.0"
note = "WAV and lossless FLAC (file.exportAudio by format or extension, File › Export › Audio…, `guitario-cli convert x.flac`; pure-Rust flacenc, checked sample for sample by decoding); no MP3 or OGG (their encoders are C libraries; the command says so)"

[[item]]
id = "PLAY-8"
target = "Sampled instruments: recorded drums, bass and guitars from open SFZ libraries"
status = "partial"
stage = "beta"
note = "SFZ engine and per-role sound bank (docs/sounds.md), tested on real libraries; samples decode on every core and in the background whenever the score needs new notes (SoundBank::preload and ready; ui-egui sounds.rs), Play waits for them instead of freezing; no release samples, filters or LFOs; not yet auditioned on speakers; the bank comes from `cargo xtask sounds`, the app cannot install it yet (issues 114, 275)"

[[item]]
id = "PLAY-9"
target = "Pedalboard of original effect models (overdrive to wah) and mastering effects on the master bus"
status = "missing"
stage = "1.0"
note = "Sound Mastering in the Song inspector is drawn greyed (issues 466 to 468, 482, 525, 526)"

[[item]]
id = "PLAY-10"
target = "Audio track: import a recording, play it with the score, sync points, embed it in the file"
status = "missing"
stage = "1.0"
note = "the toolbar's audio track button is greyed (issues 483 to 486)"
