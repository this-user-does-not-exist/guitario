# Scorecard checklist: workspace and UI against Guitar Pro 8's layout. Verified 2026-10-17 by
# offscreen renders compared with the Guitar Pro 8 manual's screenshots.
area = "ui"
title = "Workspace and UI"
order = 5

[[item]]
id = "UI-1"
target = "Toolbar in Guitar Pro 8's order and groups: home, panels, zoom, display mode, undo/redo, print, transport, two-row LCD, loop and speed, relative tonality, instrument views"
status = "done"
note = "audio track, tuner, line-in and Fretlight buttons are shown greyed out (features not built)"

[[item]]
id = "UI-2"
target = "Edition palette: note values, rhythm, dynamics, articulations, techniques, bar tools, live state"
status = "done"

[[item]]
id = "UI-3"
target = "Inspector: Song and Track tabs"
status = "partial"
stage = "1.0"
note = "Guitar Pro 8 has only these two tabs; master effects behind Sound Mastering, tuning window and transposition are greyed"

[[item]]
id = "UI-4"
target = "Global view in Guitar Pro 8's columns: icon, name, multitrack eye, mute, solo, volume, volume automation, pan, pan automation, equalizer; Master row with sections; bar grid with selection and playback"
status = "done"
note = "the eye is saved with the track (track.setHidden) and printing follows it; the Master focus knob is live in the player; neither is in Guitar Pro files yet"

[[item]]
id = "UI-5"
target = "Instrument views: fretboard (click to enter), keyboard, drum pad"
status = "partial"
stage = "1.0"
note = "all three, with toolbar buttons; no hover note names, scales or left-handed fretboard"

[[item]]
id = "UI-6"
target = "Menu bar with Guitar Pro's menus; items not built yet shown greyed out"
status = "partial"
stage = "beta"
note = "docs/parity-checklist.md"

[[item]]
id = "UI-7"
target = "Preferences persist across restarts (view, panels, transport toggles, recent files)"
status = "done"
note = "prefs.rs on craft-settings"

[[item]]
id = "UI-8"
target = "Preferences dialog, themes (light and dark), UI scale"
status = "partial"
stage = "beta"
note = "theme and interface scale only; the light theme has had one pass"

[[item]]
id = "UI-9"
target = "Mixer window: a strip per track with instrument, pan, fader, mute and solo, live while playing"
status = "done"
note = "Sound › Mixer… (mixer.rs) with an EQ button per strip and a master fader; the effect chain and mastering are in the inspector (PLAY-5)"

[[item]]
id = "UI-10"
target = "Localization framework: every user-facing string extracted and looked up by language"
status = "missing"
stage = "beta"
note = "gap G13; translations themselves are UI-11"

[[item]]
id = "UI-11"
target = "Translations (French, German, Spanish, Italian, Portuguese, Japanese, Chinese, Russian, Korean, Dutch, Polish)"
status = "missing"
stage = "1.0"
note = "needs human review per language"

[[item]]
id = "UI-12"
target = "Several documents open at once (document tabs, Window › Next Document)"
status = "done"
stage = "beta"
note = "a tab per document with its own undo, cursor and autosave copy; the clipboard crosses tabs; Close Others, Close All and Quit ask about each unsaved one; no lock icon"

[[item]]
id = "UI-13"
target = "Default shortcuts match Guitar Pro 8's (navigation, entry, effects, bars, tracks, files, views)"
status = "partial"
stage = "beta"
note = "the common ones match; the audit against the manual's tables is open (issues 528 to 531)"

[[item]]
id = "UI-14"
target = "Stylesheet window (File › Stylesheet, F7): sizes, staves, texts, symbols, fingerings, header and footer"
status = "missing"
stage = "1.0"
note = "page setup (paper, margins) exists; the rest of the stylesheet is fixed to Guitar Pro 8's defaults"

[[item]]
id = "UI-15"
target = "Help › user book: getting started, entering tab, playback, files, sounds"
status = "missing"
stage = "beta"
note = "book/ (mdBook) has introduction, getting started, editing, playback, files and shortcuts; no page on sounds, and Help › Guitario Help does not open it"
